name: Release Android APK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.json
        id: version
        run: |
          VERSION=$(node -p "require('./version.json').version")
          CODE=$(node -p "require('./version.json').versionCode")
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match version.json $VERSION" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install JS dependencies
        run: npm ci

      - name: Build web and sync Capacitor Android
        run: |
          npm run native:web
          npx cap sync android

      - name: Decode upload keystore
        id: sign
        env:
          TZARIM_KEYSTORE_BASE64: ${{ secrets.TZARIM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TZARIM_KEYSTORE_BASE64" ]; then
            echo "$TZARIM_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/tzarim-upload.jks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "No TZARIM_KEYSTORE_BASE64 — publishing a debug APK"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          TZARIM_KEYSTORE: ${{ github.workspace }}/tzarim-upload.jks
          TZARIM_KEYSTORE_PASSWORD: ${{ secrets.TZARIM_KEYSTORE_PASSWORD }}
          TZARIM_KEY_ALIAS: ${{ secrets.TZARIM_KEY_ALIAS }}
          TZARIM_KEY_PASSWORD: ${{ secrets.TZARIM_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Name the APK
        run: |
          mkdir -p dist-apk
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "dist-apk/tzarim-${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: מעקב צירים ${{ steps.version.outputs.version }}
          body: |
            התקנה ידנית לאנדרואיד.

            **הורדה:** `tzarim-${{ steps.version.outputs.version }}.apk`

            גרסה ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.code }}).
            בטלפון: פתחי את הקובץ → אפשרי התקנה ממקור לא מוכר אם אנדרואיד מבקש.
          files: dist-apk/tzarim-${{ steps.version.outputs.version }}.apk
          fail_on_unmatched_files: true
